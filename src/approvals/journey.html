<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Approval journey</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10141e; --ink: #edf1fa; --ink-2: #c5cee1; --muted: #9aa8c2;
    --border: #35415a; --surface: #20293a;
    --jt: #aeb8cc; --jt-line: #55607a; --jn: #8cedf7; --jn-line: #50c6d8;
  }
  html, body { overflow-x: clip; }
  html.jv-open { overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  header, main { padding-inline: 28px; }
  header { padding-top: 24px; }
  header p { max-width: 70rem; }
  h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.4rem); line-height: 1.18; }
  a { color: var(--jn); }
  .meta, .keys { color: var(--ink-2); font-size: .95rem; }
  .meta { margin: .45rem 0; }
  kbd { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 4px; padding: 0 .35em; font: inherit; font-size: .85em; }
  button:focus-visible { outline: 2px solid var(--ink); }
  @media (max-width: 720px) { header, main { padding-inline: 12px; } }

  /* Journey strips. */
  .juser { font-size: .95rem; color: var(--ink-2); margin: .5rem 0 .6rem; }
  .jrows { overflow-x: auto; margin: 0 0 1.4rem; padding-bottom: .3rem; }
  .jrow { width: max-content; min-width: 100%; margin: 0 0 1.1rem; }
  .jrow-name, .jside { font: 700 .78rem system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; }
  .jrow-name { position: sticky; left: 0; width: fit-content; padding: 0 0 .3rem; margin-bottom: .6rem; border-bottom: 2px solid; }
  .jrow-today .jrow-name, .jside-today { color: var(--jt); border-color: var(--jt-line); }
  .jrow-after .jrow-name, .jside-after { color: var(--jn); border-color: var(--jn-line); }
  .jgrid { display: grid; align-items: start; }
  .jscreen { margin: 0; min-width: 0; }
  .jshot { all: unset; display: block; width: 100%; cursor: zoom-in; border-radius: 10px; overflow: hidden; outline: 1px solid var(--border); line-height: 0; }
  .jshot img { display: block; width: 100%; height: auto; }
  .jshot:hover, .jshot:focus-visible { outline: 2px solid var(--ink); }
  .jscreen.is-new .jshot { outline: 2px solid var(--jn-line); }
  .jscreen figcaption { padding-top: .45rem; }
  .jcap { display: block; font-size: .86rem; line-height: 1.35; color: var(--ink); }
  .jtag { display: block; font-size: .72rem; line-height: 1.3; color: var(--muted); margin-top: .15rem; }
  .jscreen.is-new .jtag { color: var(--jn); }
  .jarrow { align-self: start; margin-top: calc(var(--sw) * .72); padding: 0 7px; text-align: center; color: var(--ink-2); min-width: 0; }
  .jarrow-l { display: block; font-size: .76rem; font-weight: 600; line-height: 1.2; color: var(--ink); margin-bottom: 4px; overflow-wrap: anywhere; }
  .jarrow svg { display: block; width: 100%; height: 14px; }
  .jarrow line { stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; } .jarrow polygon { fill: currentColor; }
  .jend { align-self: start; margin-top: calc(var(--sw) * .5); border: 1px dashed var(--jt-line); border-radius: 10px; padding: .8rem .9rem; font-size: .88rem; line-height: 1.35; color: var(--ink-2); }
  .jpairs { display: flex; flex-wrap: wrap; gap: 1.6rem var(--gap, 44px); margin: 0 0 1.2rem; }
  .jpair-name { font-weight: 700; font-size: .95rem; margin-bottom: .45rem; }
  .jpair-grid { display: grid; grid-template-columns: var(--sw) var(--aw) var(--sw); align-items: start; }
  .jpair-col { min-width: 0; }
  .jside { margin-bottom: .35rem; }
  .jpair-grid .jarrow { margin-top: calc(var(--sw) * .8 + 1.2rem); padding: 0 5px; }

  /* Full-screen viewer. */
  .jv { position: fixed; inset: 0; z-index: 9999; background: #0A0D13; display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; grid-template-rows: auto minmax(0, 1fr) auto auto; color: var(--ink); }
  .jv[hidden] { display: none; }
  .jv-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem; padding: .55rem 1rem; border-bottom: 1px solid #232A3A; }
  .jv-head { flex: 1; min-width: 0; }
  .jv-title, .jv-who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jv-title { font-weight: 700; font-size: .98rem; } .jv-who { font-size: .8rem; color: var(--muted); }
  .jv-modes { display: flex; gap: 0; flex: none; }
  .jv-modes button { all: unset; cursor: pointer; font-size: .82rem; font-weight: 600; padding: .35rem .7rem; border: 1px solid var(--border); color: var(--ink-2); }
  .jv-modes button:first-child { border-radius: 6px 0 0 6px; } .jv-modes button:last-child { border-radius: 0 6px 6px 0; } .jv-modes button + button { border-left: 0; }
  .jv-modes button.on { background: var(--surface); color: var(--ink); }
  .jv-count { flex: none; font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .jv-x { all: unset; cursor: pointer; flex: none; font-size: .82rem; font-weight: 600; padding: .35rem .7rem; border: 1px solid var(--border); border-radius: 6px; color: var(--ink-2); }
  .jv-nav { all: unset; grid-row: 2; display: grid; place-items: center; font-size: 2.2rem; cursor: pointer; color: var(--ink-2); user-select: none; }
  .jv-nav:hover { color: var(--ink); background: #121722; } .jv-nav:disabled { opacity: .2; cursor: default; background: none; }
  .jv-prev { grid-column: 1; } .jv-next { grid-column: 3; }
  .jv-stage { grid-column: 2; grid-row: 2; display: flex; justify-content: center; gap: 4vw; min-height: 0; padding: .7rem 0 .2rem; }
  .jv-pane { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; justify-items: center; min-height: 0; min-width: 0; max-width: 48%; }
  .jv-pane.is-both { max-width: 100%; }
  .jv-stage > .jv-pane:only-child { max-width: 100%; }
  .jv-pane-name { font: 700 .8rem system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; padding-bottom: .4rem; }
  .jv-pane.is-today .jv-pane-name { color: var(--jt); } .jv-pane.is-after .jv-pane-name { color: var(--jn); } .jv-pane.is-both .jv-pane-name { color: var(--ink-2); }
  .jv-pane img { height: 100%; width: auto; max-width: 100%; min-height: 0; object-fit: contain; border-radius: 12px; display: block; }
  .jv-pane-cap { font-size: .85rem; line-height: 1.35; text-align: center; padding-top: .45rem; max-width: 34rem; }
  .jv-pane-cap span { color: var(--muted); display: block; font-size: .76rem; }
  .jv-none-box { align-self: center; width: min(36vw, 300px); overflow-wrap: normal; word-break: normal; border: 1px dashed var(--jt-line); border-radius: 12px; padding: 1.2rem; color: var(--ink-2); font-size: .95rem; line-height: 1.4; text-align: center; }
  .jv-cap { grid-column: 1 / -1; text-align: center; padding: .35rem 1rem .1rem; font-size: .9rem; }
  .jv-cap b { margin-right: .8rem; } .jv-cap span { color: var(--jn); }
  .jv-strip { grid-column: 1 / -1; display: flex; justify-content: safe center; gap: 5px; padding: .45rem 1rem .7rem; overflow-x: auto; }
  .jv-th { all: unset; cursor: pointer; flex: none; display: grid; grid-template-rows: 40px 40px; gap: 3px; padding: 3px; border-radius: 6px; border: 1px solid transparent; opacity: .5; justify-items: center; }
  .jv-th img { height: 40px; width: auto; border-radius: 3px; display: block; }
  .jv-th i { display: block; height: 38px; width: 18px; border: 1px dashed #384156; border-radius: 3px; }
  .jv-th.on { opacity: 1; border-color: var(--jn-line); background: #161D2B; } .jv-th:hover { opacity: 1; }
  .jv-th.gap { margin-left: 18px; }
  @media (max-width: 820px) {
    .jv { grid-template-columns: 36px minmax(0, 1fr) 36px; }
    .jv-top { flex-wrap: wrap; gap: .4rem .6rem; padding: .4rem .6rem; } .jv-head { flex-basis: 100%; }
    .jv-nav { font-size: 1.4rem; } .jv-modes kbd { display: none; } .jv-x { margin-left: auto; }
    .jv-none-box { padding: .6rem; font-size: .8rem; }
    .jv-th { grid-template-rows: 28px 28px; } .jv-th img { height: 28px; } .jv-th i { height: 26px; width: 12px; }
  }
  @media print { .jv { display: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="meta" class="meta"></p>
  <p id="why"></p>
  <p id="slack" hidden><a>Answer on the card in Slack</a></p>
  <p class="keys">Click any screen to open it big. <kbd>←</kbd> <kbd>→</kbd> move along the journey. <kbd>↑</kbd> shows today alone, <kbd>↓</kbd> the change alone, <kbd>B</kbd> both side by side. <kbd>Esc</kbd> closes. On a phone, swipe.</p>
</header>
<main id="journeys"></main>
<script type="application/json" id="journey-data">__JOURNEY_DATA__</script>
<script>
(() => {
  const card = JSON.parse(document.getElementById('journey-data').textContent);
  const sides = ['today', 'after'];
  const list = [];
  const thumb = screen => 't/' + card.images[screen.image];
  const full = screen => 's/' + card.images[screen.image];
  const esc = text => String(text).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function cell(row, side) {
    return row[side] === 'same' ? {...row.today, source: 'Same as today', new: false} : row[side];
  }

  function screenFig(screen, idx, side) {
    const fig = el('figure', 'jscreen' + (screen.new ? ' is-new' : ''));
    const button = el('button', 'jshot');
    button.type = 'button';
    button.setAttribute('aria-label', 'Open big: ' + screen.label);
    button.onclick = () => openAt(idx, side);
    const img = el('img');
    img.src = thumb(screen); img.alt = screen.label; img.loading = 'lazy';
    button.appendChild(img);
    fig.append(button, el('figcaption', '', '<span class="jcap">' + esc(screen.label) +
      '</span><span class="jtag">' + esc(screen.source) + '</span>'));
    return fig;
  }

  function arrow(label) {
    return el('div', 'jarrow', (label ? '<span class="jarrow-l">' + esc(label) + '</span>' : '') +
      '<svg viewBox="0 0 60 14" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="7" x2="52" y2="7"/><polygon points="50,1 60,7 50,13"/></svg>');
  }

  function tap(row, side) { return typeof row.then === 'string' ? row.then : row.then?.[side]; }

  function renderRows(entry, base) {
    const wrap = el('div', 'jrows');
    wrap.dataset.steps = entry.steps.length;
    sides.forEach(side => {
      const row = el('div', 'jrow jrow-' + side);
      const grid = el('div', 'jgrid');
      entry.steps.forEach((step, i) => {
        const scr = cell(step, side);
        const slot = scr?.ends ? el('div', 'jend', esc(scr.ends)) :
          scr ? screenFig(scr, base + i, side) : el('div', 'jblank');
        slot.style.gridColumn = String(2 * i + 1);
        grid.appendChild(slot);
        if (scr && !scr.ends && entry.steps[i + 1]?.[side]) {
          const a = arrow(tap(step, side));
          a.style.gridColumn = String(2 * i + 2);
          grid.appendChild(a);
        }
      });
      row.append(el('div', 'jrow-name', esc(entry[side])), grid);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function renderPairs(entry, base) {
    const wrap = el('div', 'jpairs');
    wrap.dataset.places = entry.places.length;
    entry.places.forEach((row, i) => {
      const pair = el('div', 'jpair');
      const grid = el('div', 'jpair-grid');
      sides.forEach(side => {
        if (side === 'after') grid.appendChild(arrow(''));
        const col = el('div', 'jpair-col');
        col.append(el('div', 'jside jside-' + side, esc(entry[side])), screenFig(row[side], base + i, side));
        grid.appendChild(col);
      });
      pair.append(el('div', 'jpair-name', esc(row.name)), grid);
      wrap.appendChild(pair);
    });
    return wrap;
  }

  function fit() {
    document.querySelectorAll('.jrows').forEach(w => {
      const n = +w.dataset.steps, width = w.clientWidth, narrow = innerWidth < 720;
      const aw = narrow ? 64 : Math.max(70, Math.min(120, width * 0.06));
      const sw = Math.max(150, Math.min(330, narrow ? Math.round(innerWidth * .56) : Math.floor((width - (n - 1) * aw) / n)));
      w.style.setProperty('--sw', sw + 'px');
      w.querySelectorAll('.jgrid').forEach(g => {
        g.style.gridTemplateColumns = Array(n).fill(sw + 'px').join(' ' + aw + 'px ');
      });
    });
    document.querySelectorAll('.jpairs').forEach(w => {
      const width = w.clientWidth, aw = 34, gap = 44;
      let sw;
      for (let per = +w.dataset.places; per >= 1; per--) {
        sw = Math.floor((width - per * aw - (per - 1) * gap) / (2 * per));
        if (sw >= 170) break;
      }
      w.style.setProperty('--sw', Math.max(120, Math.min(sw, 330)) + 'px');
      w.style.setProperty('--aw', aw + 'px');
      w.style.setProperty('--gap', gap + 'px');
    });
  }

  const v = el('div', 'jv');
  v.setAttribute('role', 'dialog');
  v.setAttribute('aria-modal', 'true');
  v.setAttribute('aria-labelledby', 'viewer-title');
  v.hidden = true;
  v.innerHTML =
    '<div class="jv-top"><div class="jv-head"><div class="jv-title" id="viewer-title"></div><div class="jv-who"></div></div>' +
    '<div class="jv-modes"><button type="button" data-mode="today">Today <kbd>↑</kbd></button><button type="button" data-mode="both">Both <kbd>B</kbd></button><button type="button" data-mode="after">Change <kbd>↓</kbd></button></div>' +
    '<div class="jv-count"></div><button type="button" class="jv-x" aria-label="Close">Esc ✕</button></div>' +
    '<button type="button" class="jv-nav jv-prev" aria-label="Previous screen">←</button><div class="jv-stage"></div>' +
    '<button type="button" class="jv-nav jv-next" aria-label="Next screen">→</button>' +
    '<div class="jv-cap"></div><div class="jv-strip"></div>';
  document.body.appendChild(v);
  const vTitle = v.querySelector('.jv-title'), vWho = v.querySelector('.jv-who'), vStage = v.querySelector('.jv-stage');
  const vCap = v.querySelector('.jv-cap'), vStrip = v.querySelector('.jv-strip'), vCount = v.querySelector('.jv-count');
  const previous = v.querySelector('.jv-prev'), next = v.querySelector('.jv-next'), closeButton = v.querySelector('.jv-x');
  const modes = v.querySelectorAll('.jv-modes button');
  let current, mode, opener;

  function openAt(index, side = 'after') {
    current = index;
    mode = innerWidth < 820 ? side : 'both';
    opener = document.activeElement;
    v.hidden = false;
    document.documentElement.classList.add('jv-open');
    draw();
    closeButton.focus();
  }

  function close() {
    v.hidden = true;
    document.documentElement.classList.remove('jv-open');
    opener.focus();
  }

  function go(d) {
    const index = current + d;
    if (index < 0 || index >= list.length) return;
    current = index;
    draw();
  }

  function pane(scr, name, cls) {
    const title = '<div class="jv-pane-name">' + esc(name) + '</div>';
    if (!scr || scr.ends) {
      return '<div class="jv-pane jv-none ' + cls + '">' + title +
        '<div class="jv-none-box">' + esc(scr?.ends || 'No screen on this path at this step.') + '</div></div>';
    }
    return '<div class="jv-pane ' + cls + '">' + title + '<img src="' + full(scr) + '" alt="' + esc(scr.label) + '">' +
      '<div class="jv-pane-cap">' + esc(scr.label) + ' <span>' + esc(scr.source) + '</span></div></div>';
  }

  function draw() {
    const {entry, row, i, total} = list[current];
    vWho.textContent = entry.who;
    vCount.textContent = 'Screen ' + (current + 1) + ' of ' + list.length;
    if (mode === 'both' && row.after === 'same') {
      vStage.innerHTML = pane(row.today, entry.today + ' and ' + entry.after.toLowerCase() + ': the same screen', 'is-both');
    } else {
      vStage.innerHTML = (mode === 'both' ? sides : [mode]).map(side => pane(cell(row, side), entry[side], 'is-' + side)).join('');
    }
    const today = tap(row, 'today'), after = tap(row, 'after');
    let move = '';
    if (i + 1 < total && (today || after)) {
      move = today && after && today !== after ? entry.today + ' · ' + today + ' / ' + entry.after + ' · ' + after : after || today;
    }
    vCap.innerHTML = '<b>' + (i + 1) + ' of ' + total + (row.name ? ' · ' + esc(row.name) : '') + '</b>' +
      (move ? '<span>Next: ' + esc(move) + ' →</span>' : '');
    modes.forEach(b => {
      const on = b.dataset.mode === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    previous.disabled = current === 0;
    next.disabled = current === list.length - 1;
    vStrip.replaceChildren(...list.map((item, j) => {
      const gap = j > 0 && list[j - 1].entry !== item.entry ? ' gap' : '';
      const images = sides.map(side => {
        const scr = cell(item.row, side);
        return scr && !scr.ends ? '<img src="' + thumb(scr) + '" alt="">' : '<i></i>';
      });
      const button = el('button', 'jv-th' + (j === current ? ' on' : '') + gap, images.join(''));
      button.type = 'button';
      button.setAttribute('aria-label', 'Screen ' + (j + 1));
      button.onclick = () => { current = j; draw(); };
      return button;
    }));
    vStrip.children[current].scrollIntoView({block: 'nearest', inline: 'center'});
  }

  function setMode(value) { mode = value; draw(); }
  previous.onclick = () => go(-1);
  next.onclick = () => go(1);
  closeButton.onclick = close;
  modes.forEach(b => { b.onclick = () => setMode(b.dataset.mode); });
  let touchX = null;
  v.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive: true});
  v.addEventListener('touchend', e => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  });
  document.addEventListener('keydown', e => {
    if (v.hidden) return;
    switch (e.key) {
      case 'Escape': close(); break;
      case 'ArrowRight': case ' ': e.preventDefault(); go(1); break;
      case 'ArrowLeft': e.preventDefault(); go(-1); break;
      case 'ArrowUp': e.preventDefault(); setMode('today'); break;
      case 'ArrowDown': e.preventDefault(); setMode('after'); break;
      case 'b': case 'B': setMode('both'); break;
    }
  });

  document.title = card.title;
  document.getElementById('title').textContent = card.title;
  document.getElementById('meta').textContent = card.id + ' · v' + card.version + ' · Asked by ' + card.agent;
  document.getElementById('why').textContent = card.why;
  if (card.link) {
    const slack = document.getElementById('slack');
    slack.querySelector('a').href = card.link;
    slack.hidden = false;
  }
  vTitle.textContent = card.id + ' · ' + card.title;
  const host = document.getElementById('journeys');
  card.entries.forEach((entry, e) => {
    const base = list.length;
    const rows = entry.steps || entry.places;
    rows.forEach((row, i) => list.push({entry, row, e, i, total: rows.length}));
    host.append(el('p', 'juser', '<b>Who:</b> ' + esc(entry.who)),
      entry.steps ? renderRows(entry, base) : renderPairs(entry, base));
  });
  fit();
  window.addEventListener('resize', fit);
  const hash = /^#big=(\d+)(?::(\d+))?$/.exec(location.hash);
  if (hash) {
    const index = list.findIndex(item => item.e === +hash[1] && item.i === +(hash[2] || 0));
    if (index !== -1) openAt(index);
  }
})();
</script>
</body>
</html>
