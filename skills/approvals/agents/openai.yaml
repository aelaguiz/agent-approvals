interface:
  display_name: "Approvals"
  short_description: "Get a yes in Slack before acting; acknowledge and act on the answer"
  default_prompt: "Use $approvals to ask for approval before an operational action with a card shaped to how the approver will judge it, keep working, then acknowledge the [Approvals] answer in the thread, act on it when it arrives (or when approvals inbox hands it to you after you pick work back up), and keep the card current until the thing is really out."

policy:
  allow_implicit_invocation: true
