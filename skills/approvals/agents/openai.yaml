interface:
  display_name: "Approvals"
  short_description: "Get a yes in Slack before acting; answer the approver and act on the yes"
  default_prompt: "Use $approvals to ask for approval before an operational action. Before drafting a card, run approvals guide <type> and read the corrections he has given for that kind of card, then how to write it. Open the card with why it's worth doing and write it in the approver's words, shaped to how he will judge it. A change to what users see goes on the card as its journey: today's path and the changed one, each tap named. Use submit --to <name> for another approver the workspace lists, as your own repository directs. Keep working. When the answer arrives here or through approvals inbox, act on it as the approver's, including when it names a teammate who answered. A hand-off notice needs no acknowledgement. Answer questions in the thread with one verdict-first reply, with revise --answer when the card changes too, and keep the card true until the thing his yes asked for has happened. As the reviewer of some card types (the CFO, for money), take the role with approvals review and post your read in the card's thread with approvals note. As the default approver's deputy, take the role with approvals deputy and make one call on each of his cards with approvals call. Use --also <name> with --his on a version that has no current send. The same why goes to both people. The card waits for that person's working hours unless the call carries --urgent."

policy:
  allow_implicit_invocation: true
